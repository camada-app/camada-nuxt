name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with: { path: camada-nuxt }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-core, path: camada-core }
      - uses: actions/checkout@v4
        with: { repository: ${{ github.repository_owner }}/camada-browser, path: camada-browser }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }} }
      - run: npm install && npm run build
        working-directory: camada-core
      - run: npm install && npm run build
        working-directory: camada-browser
      - run: npm install
        working-directory: camada-nuxt
      - run: npm run build
        working-directory: camada-nuxt
      - run: npm run check
        working-directory: camada-nuxt
      - run: npm test
        working-directory: camada-nuxt
